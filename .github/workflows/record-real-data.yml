name: Record real data

# Manual only. Records genuine validation data on disposable GitHub runners: NetLog and Performance
# trace pairs from real Chrome and Edge on Windows and Linux, and real chrome://policy exports with
# managed (made-up, network-related) policies set on the runner. Nothing here touches a personal machine.
# Download the artifacts with `gh run download`; they contain only public pages and made-up policies.

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Record a Chrome NetLog and trace pair (unmanaged)
        run: node scripts/record-real-data.mjs pair "$(which google-chrome)" out linux-chrome
      - name: Set managed Chrome policies on this disposable runner
        run: |
          sudo mkdir -p /etc/opt/chrome/policies/managed /etc/opt/chrome/policies/recommended
          sudo tee /etc/opt/chrome/policies/managed/socketmap-test.json > /dev/null <<'JSON'
          {
            "ProxyMode": "pac_script",
            "ProxyPacUrl": "http://wpad.corp.example.com/proxy.pac",
            "MaxConnectionsPerProxy": "many",
            "DnsOverHttpsMode": "automatic",
            "QuicAllowed": false,
            "NetworkPredictionOptions": 2,
            "HomepageLocation": "https://intranet.corp.example.com/",
            "NotARealPolicy": true,
            "CloudProfileReportingEnabled": true
          }
          JSON
          sudo tee /etc/opt/chrome/policies/recommended/socketmap-test.json > /dev/null <<'JSON'
          { "ShowHomeButton": true, "DefaultBrowserSettingEnabled": false }
          JSON
      - name: Export the managed Chrome policy page as JSON
        run: node scripts/record-real-data.mjs policy "$(which google-chrome)" out/linux-chrome-policies.json
      - name: Network path helper with a proxy environment and a route that answers
        run: |
          sudo apt-get install -y traceroute > /dev/null
          GATEWAY="$(ip route show default | awk 'NR==1{print $3}')"
          export https_proxy="http://user:secret@proxy.corp.example.com:3128" http_proxy="http://proxy.corp.example.com:3128"
          ./tools/socketmap-path.sh --no-public-ip --out out/linux-path.json github.com "$GATEWAY"
          node scripts/check-helper-output.mjs out/linux-path.json --require-hosts 2
      - uses: actions/upload-artifact@v4
        with:
          name: linux-real-data
          path: out
          retention-days: 3

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Record a Chrome NetLog and trace pair (unmanaged)
        run: node scripts/record-real-data.mjs pair "C:\Program Files\Google\Chrome\Application\chrome.exe" out windows-chrome
      - name: Record an Edge NetLog and trace pair (unmanaged)
        run: node scripts/record-real-data.mjs pair "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" out windows-edge
      - name: Set managed policies on this disposable runner
        shell: powershell
        run: |
          foreach ($key in @('HKLM:\SOFTWARE\Policies\Google\Chrome', 'HKLM:\SOFTWARE\Policies\Microsoft\Edge')) {
            New-Item -Path $key -Force | Out-Null
            Set-ItemProperty -Path $key -Name ProxyMode -Value 'pac_script' -Type String
            Set-ItemProperty -Path $key -Name ProxyPacUrl -Value 'http://wpad.corp.example.com/proxy.pac' -Type String
            Set-ItemProperty -Path $key -Name MaxConnectionsPerProxy -Value 32 -Type DWord
            Set-ItemProperty -Path $key -Name DnsOverHttpsMode -Value 'automatic' -Type String
            Set-ItemProperty -Path $key -Name QuicAllowed -Value 0 -Type DWord
            Set-ItemProperty -Path $key -Name NetworkPredictionOptions -Value 2 -Type DWord
            Set-ItemProperty -Path $key -Name CloudProfileReportingEnabled -Value 1 -Type DWord
          }
          # The same policies at user level with different values, so the export carries conflicts and superseded values.
          New-Item -Path 'HKCU:\SOFTWARE\Policies\Google\Chrome' -Force | Out-Null
          Set-ItemProperty -Path 'HKCU:\SOFTWARE\Policies\Google\Chrome' -Name DnsOverHttpsMode -Value 'off' -Type String
          Set-ItemProperty -Path 'HKCU:\SOFTWARE\Policies\Google\Chrome' -Name MaxConnectionsPerProxy -Value 8 -Type DWord
      - name: Export the managed Chrome policy page as JSON
        run: node scripts/record-real-data.mjs policy "C:\Program Files\Google\Chrome\Application\chrome.exe" out/windows-chrome-policies.json
      - name: Try the Edge policy page (its page has no Copy as JSON button, so this may fail)
        continue-on-error: true
        run: node scripts/record-real-data.mjs policy "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" out/windows-edge-policies.json edge://policy
      - name: Windows proxy, PAC and auto-detect settings, then the network path helper
        shell: powershell
        run: |
          $ie = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings'
          Set-ItemProperty -Path $ie -Name ProxyEnable -Value 1 -Type DWord
          Set-ItemProperty -Path $ie -Name ProxyServer -Value 'http=user:secret@proxy.corp.example.com:3128;https=proxy.corp.example.com:3128' -Type String
          Set-ItemProperty -Path $ie -Name AutoConfigURL -Value 'http://wpad.corp.example.com/proxy.pac' -Type String
          Set-ItemProperty -Path $ie -Name ProxyOverride -Value '*.corp.example.com;<local>' -Type String
          $conn = "$ie\Connections"
          New-Item -Path $conn -Force | Out-Null
          [byte[]]$blob = New-Object byte[] 60
          $blob[0] = 0x46; $blob[4] = 1; $blob[8] = 0x0F   # direct + proxy + PAC + auto-detect
          Set-ItemProperty -Path $conn -Name DefaultConnectionSettings -Value $blob -Type Binary
          $gateway = (Get-NetRoute -DestinationPrefix '0.0.0.0/0' | Sort-Object RouteMetric | Select-Object -First 1).NextHop
          .\tools\socketmap-path.ps1 -NoPublicIp -Out out\windows-path.json github.com $gateway
          node scripts/check-helper-output.mjs out/windows-path.json --require-hosts 2
      - uses: actions/upload-artifact@v4
        with:
          name: windows-real-data
          path: out
          retention-days: 3

  edge-export:
    # Edge's policy page has no Copy as JSON button; its Export to JSON opens a native save dialog. This job drives that
    # dialog with keystrokes on a disposable Windows runner, to capture an actual exported Edge file.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set managed Edge policies on this disposable runner
        shell: powershell
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge'
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name ProxyMode -Value 'pac_script' -Type String
          Set-ItemProperty -Path $key -Name ProxyPacUrl -Value 'http://wpad.corp.example.com/proxy.pac' -Type String
          Set-ItemProperty -Path $key -Name MaxConnectionsPerProxy -Value 32 -Type DWord
          Set-ItemProperty -Path $key -Name QuicAllowed -Value 0 -Type DWord
          Set-ItemProperty -Path $key -Name NetworkPredictionOptions -Value 2 -Type DWord
      - name: Click Export to JSON and complete the save dialog
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path out -Force | Out-Null
          $target = Join-Path (Get-Location).Path 'out\edge-policies.json'
          $job = Start-Job -ArgumentList $target -ScriptBlock {
            param($target)
            Add-Type -AssemblyName System.Windows.Forms
            Start-Sleep -Seconds 14
            for ($i = 0; $i -lt 6; $i++) {
              [System.Windows.Forms.SendKeys]::SendWait($target)
              Start-Sleep -Milliseconds 800
              [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
              Start-Sleep -Seconds 4
              if (Test-Path $target) { break }
            }
          }
          node scripts/record-real-data.mjs export-click "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" edge://policy 40
          Wait-Job $job -Timeout 60 | Out-Null
          Receive-Job $job | Out-Null
          if (Test-Path $target) { Write-Host "exported:" (Get-Item $target).Length "bytes" } else { Write-Host "no file was saved" }
      - uses: actions/upload-artifact@v4
        with:
          name: edge-export
          path: out
          retention-days: 3
          if-no-files-found: warn
