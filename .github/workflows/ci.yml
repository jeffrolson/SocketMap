name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit, CLI and design-token checks
        run: npm run verify
      - name: Build the viewer
        run: npm run build:viewer
      - name: Real-browser smoke test
        run: npm run test:browser
      - name: Network path helper (Mac and Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./tools/socketmap-path.sh --no-public-ip --out path-ci.json github.com
          node scripts/check-helper-output.mjs path-ci.json --require-probe
      - name: Network path helper (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\tools\socketmap-path.ps1 -NoPublicIp -Out path-ci.json github.com
          node scripts/check-helper-output.mjs path-ci.json --require-probe
      - name: The viewer makes no remote requests
        shell: bash
        run: |
          if grep -Eq "<(script|img|iframe|link)[^>]+(src|href)=[\"']?https?:" socketmap-viewer.html; then echo "remote load found"; exit 1; fi
          if grep -Eq "url\(['\"]?https?:|@import" socketmap-viewer.html; then echo "remote stylesheet load found"; exit 1; fi
